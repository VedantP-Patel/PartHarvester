[package]
name = "core-engine"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
wreq = { version = "6.0.0-rc.14", features = ["cookies", "gzip", "brotli", "deflate", "json", "form"] }
wreq-util = "3.0.0-rc.3"
futures-util = "0.3"
http-body-util = "0.1"
bytes = "1"
regex = "1"
url = "2"
bs58 = "0.5"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
flate2 = "1"
base64 = "0.22"
crc32fast = "1"
md-5 = "0.10"
hex = "0.4"
html-escape = "0.2"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
parking_lot = "0.12"
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
if-addrs = "0.13"

[dev-dependencies]
tempfile = "3"
