name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-v1-python:
    name: Test Web Edition (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-edition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt pytest
          PYTHONPATH=. pytest tests

  test-v2-rust:
    name: Test Desktop App (Rust & UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang nasm libsqlite3-dev
          npm --prefix desktop-app/ui ci
          npm --prefix desktop-app/ui run build
          cargo test --manifest-path desktop-app/Cargo.toml -p core-engine

  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    needs: [test-v1-python, test-v2-rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake clang nasm
      - name: Install Windows dependencies (NASM)
        if: runner.os == 'Windows'
        run: choco install nasm -y
      - name: Build UI
        run: |
          npm --prefix desktop-app/ui ci
          npm --prefix desktop-app/ui run build
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app/crates/tauri-app
          args: --config '{"build":{"beforeBuildCommand":""}}'
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "PartHarvester ${{ github.ref_name }}"
          releaseBody: "Cross-platform native desktop builds (Windows & Linux)."
          releaseDraft: false
          prerelease: false
